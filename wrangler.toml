name = "llm-guard-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
UPSTREAM_OPENAI_URL = "https://api.openai.com"
UPSTREAM_ANTHROPIC_URL = "https://api.anthropic.com"
# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   PROXY_AUTH_TOKEN   bearer token clients must send to the proxy
#   OPENAI_API_KEY     upstream key for /v1/chat/completions
#   ANTHROPIC_API_KEY  upstream key for /v1/messages
#   AUDIT_SALT         salt for hashed values in audit logs

[env.dev.vars]
MOCK_UPSTREAM = "1"
ALLOW_UNAUTHENTICATED = "1"
